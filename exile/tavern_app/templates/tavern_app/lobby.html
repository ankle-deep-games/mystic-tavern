{% extends 'tavern_app/mt_base.html' %}

{% block content %}
    <h1 class="text-danger my-4">Game Lobby</h1>
    <hr>
    <h2 class="text-primary my-4">Players:</h2>
    {% for gameuser in object_list %}
        <div class="card mb-4" style="width: 25rem;">
          <div class="card-body">
              <h4 class="card-title text-primary">Player: {{ gameuser.user.username }}</h4>
              <ul>
                <li>Game ID: {{ gameuser.game_id }}</li>
                <li>GameUser ID: {{ gameuser.id }}</li>
              </ul>
          </div>
        </div>
    {% endfor %}
{% endblock %}
