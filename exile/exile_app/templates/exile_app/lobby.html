{% extends 'exile_app/mt_base.html' %}

{% block content %}
    <h1 class="text-danger my-4">Game Lobby</h1>
    <hr>
    {% for user in object_list %}
        <div class="card mb-4" style="width: 25rem;">
          <div class="card-body">
              <h4 class="card-title text-primary">User ID: {{ user.user_id }}</h4>
              <ul>
                <li>Game ID: {{ user.game_id }}</li>
                <li>GameUser ID: {{ user.id }}</li>
              </ul>
          </div>
        </div>
    {% endfor %}
{% endblock %}
