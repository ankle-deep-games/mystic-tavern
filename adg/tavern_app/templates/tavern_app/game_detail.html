{% extends 'tavern_app/mt_base.html' %}

{% block content %}
<h1> Join Game </h1>
    <div class="form-group mb-3">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-secondary">Join Lobby</button>
        </form>
    </div>

{% if messages %}
    {% for message in messages %}
        <div {% if message.tags %} class="{{ message.tags }}"{% endif %} role="alert">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

{% endblock %}
