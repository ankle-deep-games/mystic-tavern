{% extends 'tavern_app/mt_base.html' %}

{% block content %}
<div class="container">

    <h1 class="my-3">Join Game: {{ game_name }}</h1>

    {% if messages %}
    {% for message in messages %}
    <div {% if message.tags %} class="{{ message.tags }}" {% endif %} role="alert">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <div class="form-group mb-3">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary">Join Lobby</button>
        </form>
    </div>

</div>
{% endblock %}
