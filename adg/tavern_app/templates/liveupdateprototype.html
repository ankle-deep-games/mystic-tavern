<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mystic Tavern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" href="{% static 'tavern_app/custom_styles.css' %}">
  </head>
  <body class="bg-black text-white">

  <div class="container mt-3">
    <h1 class="mb-3">Live Update Prototype</h1>
    <samp class="my-2 text-success">New games will be shown on this page as they are added</samp>
    <br>
    <ul id="game-data">

      {% comment %} load initial game data before ajax. 
      ajax will then empty the li and append new data {% endcomment %}
      {% for game in games %}
        <li>{{ game.name }}</li>
      {% endfor %}

    </ul>

  </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js" integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function(){
            setInterval(function(){
                $.ajax({
                    type: 'GET',
                    url: "{% url 'tavern_app:liveupdateprototype' %}",
                    success: function(response){
                        console.log(response);

                        $("#game-data").empty();
                        for (var key in response.games){
                            var temp="<li>"+ response.games[key].name +"</li>";
                            $("#game-data").append(temp);
                        }

                    },
                    error: function(response){
                        console.log('error getting data');
                    }
                });
            },2000);
        });
    </script>

  </body>
</html>
