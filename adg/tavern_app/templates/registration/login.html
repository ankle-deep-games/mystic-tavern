{% extends 'base.html' %}

{% block content %}

<h1>Log In</h1>
<div class="form-group">
  {% comment %} Added p manually so we can apply bootstrap form-control class to inputs {% endcomment %}
  {% comment %} TODO add error messaging when incorrect info {% endcomment %}
  <form method="POST">
    {% csrf_token %}
    <p>
      <label for="id_username">Username:</label>
      <input class="form-control" type="text" name="username" autofocus="" autocapitalize="none" autocomplete="username" maxlength="150" required="" id="id_username">
    </p>
    <p>
      <label for="id_password">Password:</label>
      <input class="form-control" type="password" name="password" autocomplete="current-password" required="" id="id_password">
    </p>
    <button class="btn btn-secondary" type="submit">Log In</button>
  </form>
</div>
{% endblock %}
