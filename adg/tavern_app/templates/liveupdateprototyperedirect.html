<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mystic Tavern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  </head>
  <body class="bg-black text-white">

  <div class="container mt-3">
    <h1 class="mb-3">Live Update Prototype</h1>
    <samp class="my-2 text-success">When a new game is added the page will redirect to homepage.</samp>
    <br>
   
  </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js" integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function(){
            let gameNumPrev = {{ gameCount }};
            let gameNumNew;
            setInterval(function(){
                $.ajax({
                    type: 'GET',
                    url: "{% url 'tavern_app:liveupdateprototype' %}",
                    success: function(response){
                        console.log(response);

                        console.log("gameNumPrev is " + gameNumPrev);

                        gameNumNew = response.games.length;
                        console.log("gameNumNew is " + gameNumNew);

                        if (gameNumPrev == gameNumNew) {
                            console.log("A new game has not been added");
                        } else if (gameNumNew > gameNumPrev) {
                            console.log("A new game HAS been added");
                            window.location.assign("{% url 'tavern_app:games' %}")
                        }


                    },
                    error: function(response){
                        console.log('error getting data');
                    }
                });
            },2000);
        });
    </script>

  </body>
</html>
